<style>
/* Layout: one working screen. Inputs on the left; on the right one number and one of three views of it: side view, the camera screen, a lookup table. */
:root{
  --bg:#EEF2F4; --panel:#FFFFFF; --ink:#13202B; --muted:#51616E; --line:#C5D0D8;
  --accent:#1554C9; --accent-soft:#D9E5FB; --on-accent:#FFFFFF;
  --warn:#8A5200; --warn-soft:#FBEFD9; --ground:#7F909C; --earth:#DFE6EA;
  --f-display:"Unbounded","Segoe UI",system-ui,sans-serif;
  --f-body:"Commissioner","Segoe UI",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E161D; --panel:#17222C; --ink:#E7EEF3; --muted:#9FB0BD; --line:#2F3F4C;
    --accent:#7FAEFF; --accent-soft:#1A2E50; --on-accent:#0B1420;
    --warn:#F0B45A; --warn-soft:#3A2C12; --ground:#647888; --earth:#141F28; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E161D; --panel:#17222C; --ink:#E7EEF3; --muted:#9FB0BD; --line:#2F3F4C;
  --accent:#7FAEFF; --accent-soft:#1A2E50; --on-accent:#0B1420;
  --warn:#F0B45A; --warn-soft:#3A2C12; --ground:#647888; --earth:#141F28; color-scheme:dark;
}
/* Night flight: dim red on black so the screen does not blind. Switched by the «Ніч» button, wins over both themes. */
:root[data-night="1"]{
  --bg:#050000; --panel:#0E0202; --ink:#FF6A5C; --muted:#C9574B; --line:#4A1611;
  --accent:#FF3B2E; --accent-soft:#2E0906; --on-accent:#0A0000;
  --warn:#FF8E63; --warn-soft:#2B0E06; --ground:#8A2D23; --earth:#150403; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin-inline:auto;padding-block:18px 36px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(20px,3.2vw,28px);line-height:1.15;margin:0;text-wrap:balance;min-width:0}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.out{display:flex;flex-direction:column;gap:14px;min-width:0;order:-1}
.ctls{display:flex;flex-direction:column;gap:22px;min-width:0}
@media (min-width:860px){
  .grid{grid-template-columns:minmax(340px,5fr) minmax(0,6fr);align-items:start;gap:28px}
  .out{order:2;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
}
.result{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 18px 16px}
@media (max-width:859px){ .result{position:sticky;top:env(safe-area-inset-top,0px);z-index:5} }
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;color:var(--accent);font-family:var(--f-display);font-weight:700;line-height:1.05;margin-top:4px}
.big output{font-size:clamp(44px,10vw,76px);font-variant-numeric:tabular-nums}
.big .unit{font-size:clamp(20px,4vw,30px);font-weight:500}
.big .pm{font-family:var(--f-data);font-size:clamp(15px,2.4vw,20px);font-weight:500;color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.msg{margin-top:10px;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:15px}
.view svg{display:block;width:100%;height:auto}
#scr{border-radius:12px;border:1px solid var(--line)}
#v-handle{cursor:grab;touch-action:none}
#v-handle:active{cursor:grabbing}
.t-dim{font-family:var(--f-data);font-size:22px;fill:var(--muted)}
.t-ref{font-family:var(--f-data);font-size:18px;fill:var(--muted)}
.t-ink{fill:var(--ink);font-weight:500}
.t-acc{font-family:var(--f-data);font-size:27px;font-weight:500;fill:var(--accent)}
.t-big{font-family:var(--f-data);font-size:40px;font-weight:500;fill:var(--accent);paint-order:stroke;stroke:var(--earth);stroke-width:8px;stroke-linejoin:round}
.t-iso{font-family:var(--f-data);font-size:19px;fill:var(--muted);paint-order:stroke;stroke:var(--earth);stroke-width:6px;stroke-linejoin:round}
.ctl{display:flex;flex-direction:column;gap:10px;min-width:0}
.ctl label,.ctl .name{font-weight:600;font-size:17px}
.row{display:flex;align-items:center;gap:10px}
.step{flex:0 0 54px;height:54px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:500 26px/1 var(--f-data);cursor:pointer}
.num{flex:1 1 0;min-width:0;height:54px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:500 28px/1 var(--f-data);text-align:center;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:40px;accent-color:var(--accent);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);font:500 16px/1 var(--f-body);cursor:pointer}
.chip[aria-pressed="true"],.seg button[aria-pressed="true"],.cell[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg{display:flex;gap:8px}
.seg button{flex:1 1 0;min-width:0;min-height:50px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:600 16px/1.1 var(--f-body);cursor:pointer;padding:6px 8px}
.views button{min-height:44px;font-size:15px}
.zoomrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.zoomrow .num{flex:0 0 120px}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{border-collapse:separate;border-spacing:4px;width:100%;font-family:var(--f-data);font-variant-numeric:tabular-nums}
.tbl caption{caption-side:top;text-align:left;font:500 14px/1.3 var(--f-body);color:var(--muted);padding:0 4px 4px}
.tbl th{font:500 14px/1 var(--f-data);color:var(--muted);padding:6px 4px;text-align:center;white-space:nowrap}
.tbl td{padding:0}
.cell{display:block;width:100%;min-width:58px;min-height:42px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);font:500 16px/1 var(--f-data);cursor:pointer;white-space:nowrap;padding:0 6px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Відстань до краю кадру</h1>
    <button class="chip" id="night" type="button" aria-pressed="false">Ніч</button>
  </header>

  <div class="grid">
    <div class="ctls">
      <section class="ctl">
        <label for="h-num">Висота, м</label>
        <div class="row">
          <button class="step" id="h-minus" type="button" aria-label="Висота мінус 10 метрів">−</button>
          <input class="num" id="h-num" type="text" inputmode="numeric" autocomplete="off" value="100">
          <button class="step" id="h-plus" type="button" aria-label="Висота плюс 10 метрів">+</button>
        </div>
        <input id="h-range" type="range" min="10" max="1500" step="5" value="100" aria-label="Висота, повзунок">
        <div class="chips" id="h-chips">
          <button class="chip" type="button" data-h="100">100</button>
          <button class="chip" type="button" data-h="150">150</button>
          <button class="chip" type="button" data-h="200">200</button>
          <button class="chip" type="button" data-h="300">300</button>
          <button class="chip" type="button" data-h="400">400</button>
          <button class="chip" type="button" data-h="500">500</button>
        </div>
      </section>

      <section class="ctl">
        <label for="a-num">Кут нахилу камери, °</label>
        <div class="row">
          <button class="step" id="a-minus" type="button" aria-label="Кут мінус 1 градус">−</button>
          <input class="num" id="a-num" type="text" inputmode="decimal" autocomplete="off" value="0">
          <button class="step" id="a-plus" type="button" aria-label="Кут плюс 1 градус">+</button>
        </div>
        <input id="a-range" type="range" min="0" max="90" step="0.5" value="0" aria-label="Кут нахилу, повзунок">
        <div class="chips" id="a-chips">
          <button class="chip" type="button" data-a="0">0°</button>
          <button class="chip" type="button" data-a="10">10°</button>
          <button class="chip" type="button" data-a="20">20°</button>
          <button class="chip" type="button" data-a="30">30°</button>
          <button class="chip" type="button" data-a="45">45°</button>
          <button class="chip" type="button" data-a="60">60°</button>
          <button class="chip" type="button" data-a="90">90°</button>
        </div>
      </section>

      <section class="ctl">
        <span class="name" id="l-z">Камера й зум</span>
        <div class="seg" id="devs" role="group" aria-labelledby="l-z">
          <button type="button" data-dev="mavic3">Mavic 3</button>
          <button type="button" data-dev="m4t">Matrice 4T</button>
          <button type="button" data-dev="autel">Autel</button>
        </div>
        <div class="chips" id="presets" role="group" aria-label="Зум із таблиці"></div>
        <div class="zoomrow">
          <label for="z-num">Свій зум, x</label>
          <input class="num" id="z-num" type="text" inputmode="decimal" autocomplete="off" value="1">
        </div>
      </section>
    </div>

    <div class="out">
      <section class="result" aria-live="polite">
        <div class="eyebrow">Нижній край кадру</div>
        <div class="big"><output id="out-d" for="h-num a-num z-num">300</output><span class="unit" id="out-unit">м</span><span class="pm" id="out-pm">± 24 м</span></div>
        <div class="msg" id="out-msg" hidden></div>
      </section>

      <div class="seg views" id="views" role="group" aria-label="Вигляд">
        <button type="button" data-view="side">Збоку</button>
        <button type="button" data-view="screen">Як на екрані</button>
        <button type="button" data-view="table">Таблиця</button>
      </div>

      <div class="view" id="pane-side">
        <svg id="view" viewBox="0 0 720 300" role="img" aria-label="Вид збоку: борт на висоті, промінь нижнього краю кадру до землі. Точку на землі можна тягнути пальцем, кут камери зміниться.">
          <g id="v-body"></g>
          <g id="v-handle"><circle r="28" fill="transparent"/><circle r="18" fill="none" stroke="var(--accent)" stroke-opacity=".4" stroke-width="2"/><circle r="11" fill="var(--accent)"/></g>
        </svg>
      </div>
      <div class="view" id="pane-screen" hidden>
        <svg id="scr" viewBox="0 0 720 405" role="img" aria-label="Як на екрані борта: горизонт, земля з лініями відстані, нижній край кадру підписано відстанню"></svg>
      </div>
      <div class="view tablewrap" id="pane-table" hidden>
        <table class="tbl" id="tbl"></table>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var RAD = Math.PI / 180;
  var DEV = {
    mavic3: { presets: [
      { id: 'f1', label: '1x польова', z: 1, v: 36.9, field: true },
      { id: '1', label: '1x', z: 1, v: 46 }, { id: '2', label: '2x', z: 2, v: 24 }, { id: '3', label: '3x', z: 3, v: 16 },
      { id: '4', label: '4x', z: 4, v: 12 }, { id: '5', label: '5x', z: 5, v: 9.7 }, { id: '7', label: '7x', z: 7, v: 7 },
      { id: '10', label: '10x', z: 10, v: 4.9 }, { id: '14', label: '14x', z: 14, v: 3.5 },
      { id: '20', label: '20x', z: 20, v: 2.5 }, { id: '28', label: '28x', z: 28, v: 1.8 } ] },
    m4t: { presets: [
      { id: '1', label: '1x широка', z: 1, v: 50 }, { id: '3', label: '3x', z: 3, v: 22 },
      { id: '7', label: '7x', z: 7, v: 8 }, { id: '28', label: '28x', z: 28, v: 2.5 } ] },
    autel: { presets: [
      { id: '1', label: '1x', z: 1, v: 51 }, { id: '2', label: '2x', z: 2, v: 26 }, { id: '4', label: '4x', z: 4, v: 13 },
      { id: '8', label: '8x', z: 8, v: 6.5 }, { id: '10', label: '10x', z: 10, v: 5 } ] }
  };
  var DEVNAME = { mavic3: 'Mavic 3', m4t: 'Matrice 4T', autel: 'Autel' };
  var VIEWS = ['side', 'screen', 'table'];
  var TH = [100, 150, 200, 300, 400, 500], TA = [0, 5, 10, 15, 20, 30, 45, 60];
  var NICE = [25, 50, 75, 100, 150, 200, 300, 400, 500, 750, 1000, 1500, 2000, 3000, 5000, 7500, 10000, 15000, 20000, 30000, 50000];
  var KEY = 'krai-kadru-v1';
  var st = { dev: 'mavic3', preset: 'f1', zoom: 1, h: 100, a: 0, view: 'side', night: false };
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && DEV[saved.dev] && isFinite(saved.h) && isFinite(saved.a) && isFinite(saved.zoom)) {
      st = { dev: saved.dev, preset: saved.preset || null, zoom: +saved.zoom, h: +saved.h, a: +saved.a,
        view: VIEWS.indexOf(saved.view) >= 0 ? saved.view : 'side', night: !!saved.night };
    }
  } catch (e) {}

  var geo = { x0: 112, yD: 0, s: 1 };   /* side-view geometry, read by the drag handler */
  var drag = null;                       /* { s: frozen scale } while the ground point is held */

  function $(id) { return document.getElementById(id); }
  function clamp(n, lo, hi) { return Math.min(hi, Math.max(lo, n)); }
  function px(n) { return Math.round(n * 10) / 10; }
  function num(s) {
    var n = parseFloat(String(s).replace(',', '.').replace(/[^0-9.]/g, ''));
    return isFinite(n) ? n : null;
  }
  function grp(n) {
    var r = Math.round(n);
    var s = String(Math.abs(r)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return (r < 0 ? '−' : '') + s;
  }
  function dec(n) { return String(Math.round(n * 10) / 10).replace('.', ','); }

  function presetObj() {
    if (!st.preset) return null;
    var list = DEV[st.dev].presets;
    for (var i = 0; i < list.length; i++) if (list[i].id === st.preset) return list[i];
    return null;
  }
  /* Vertical field of view for any zoom: table values exactly, smooth in between, 1/zoom beyond the last one. */
  function vfovFor(dev, zoom) {
    var ps = DEV[dev].presets.filter(function (p) { return !p.field; });
    if (zoom <= ps[0].z) return ps[0].v;
    for (var i = 0; i < ps.length - 1; i++) {
      var A = ps[i], B = ps[i + 1];
      if (zoom <= B.z) {
        var la = Math.log(Math.tan(A.v / 2 * RAD)), lb = Math.log(Math.tan(B.v / 2 * RAD));
        var k = (Math.log(zoom) - Math.log(A.z)) / (Math.log(B.z) - Math.log(A.z));
        return 2 * Math.atan(Math.exp(la + (lb - la) * k)) / RAD;
      }
    }
    var L = ps[ps.length - 1];
    return 2 * Math.atan(Math.tan(L.v / 2 * RAD) * L.z / zoom) / RAD;
  }
  function currentV() { var p = presetObj(); return p ? p.v : vfovFor(st.dev, st.zoom); }
  function currentZ() { var p = presetObj(); return p ? p.z : st.zoom; }

  /* h metres, a degrees below the horizon, v vertical field of view in degrees. */
  function calc(h, a, v) {
    var tb = a + v / 2, tt = a - v / 2;
    var r = { tb: tb, tt: tt, v: v, bottom: null, slant: null, err: null, center: null, top: null };
    if (tb > 0) {
      r.bottom = h / Math.tan(tb * RAD);
      r.slant = h / Math.sin(tb * RAD);
      r.err = Math.sqrt(2 * Math.pow(h / Math.pow(Math.sin(tb * RAD), 2) * RAD, 2) + Math.pow(5 / Math.tan(tb * RAD), 2));
    }
    if (a > 0) r.center = h / Math.tan(a * RAD);
    if (tt > 0) r.top = h / Math.tan(tt * RAD);
    return r;
  }
  /* Where a ground point d metres ahead sits on the screen: -1 bottom edge, 0 centre, +1 top edge. */
  function yn(h, a, v, d) { return Math.tan((a - Math.atan2(h, d) / RAD) * RAD) / Math.tan(v / 2 * RAD); }
  window.kraiKadru = { calc: calc, vfovFor: vfovFor, yn: yn, geo: geo };

  function drawSide(h, a, r) {
    var W = 720, H = 300, x0 = 112, yG = 236, xMax = W - 22, yTop = 16;
    var s;
    if (drag) s = drag.s;
    else {
      if (r.bottom !== null && r.bottom > 0) s = Math.min((xMax - x0) * 0.58 / r.bottom, 178 / h); else s = 178 / h;
      if (h * s < 24) s = 24 / h;
    }
    var yD = yG - h * s;
    geo.x0 = x0; geo.yD = yD; geo.s = s;
    function end(t) {
      if (t <= 0) {
        var up = Math.tan(-t * RAD), y = yD - (xMax - x0) * up;
        if (y < yTop && up > 0) return { x: x0 + (yD - yTop) / up, y: yTop, k: 'top' };
        return { x: xMax, y: y, k: 'right' };
      }
      if (t >= 90) {
        var xb = x0 - (h / Math.tan((180 - t) * RAD)) * s;
        if (xb < 10) return { x: 10, y: Math.min(yG, yD + (x0 - 10) * Math.tan((180 - t) * RAD)), k: 'left' };
        return { x: xb, y: yG, k: 'ground' };
      }
      var x = x0 + h / Math.tan(t * RAD) * s;
      if (x > xMax) return { x: xMax, y: yD + (xMax - x0) * Math.tan(t * RAD), k: 'right' };
      return { x: x, y: yG, k: 'ground' };
    }
    function ray(E, color, w) {
      return '<line x1="' + x0 + '" y1="' + px(yD) + '" x2="' + px(E.x) + '" y2="' + px(E.y) + '" stroke="' + color +
        '" stroke-width="' + w + '" stroke-linecap="round" fill="none"/>';
    }
    var B = end(r.tb), T = end(r.tt);
    var pts = [[x0, yD], [B.x, B.y]];
    if (B.k === 'left') pts.push([10, yG]);
    if (B.k === 'ground' && T.k !== 'ground') pts.push([xMax, yG]);
    if ((B.k === 'ground' || B.k === 'right') && T.k === 'top') pts.push([xMax, yTop]);
    pts.push([T.x, T.y]);
    var o = '';
    o += '<rect x="0" y="' + yG + '" width="' + W + '" height="' + (H - yG) + '" fill="var(--earth)"/>';
    o += '<polygon points="' + pts.map(function (q) { return px(q[0]) + ',' + px(q[1]); }).join(' ') + '" fill="var(--accent-soft)"/>';
    o += '<line x1="0" y1="' + yG + '" x2="' + W + '" y2="' + yG + '" stroke="var(--ground)" stroke-width="2" fill="none"/>';
    /* What the angle is counted from: the dashed horizon is 0°, straight down is 90°. */
    o += '<line x1="' + x0 + '" y1="' + px(yD) + '" x2="' + xMax + '" y2="' + px(yD) + '" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 6" fill="none"/>';
    o += '<text x="' + xMax + '" y="' + px(yD - 9) + '" text-anchor="end" class="t-ref">0°</text>';
    o += '<line x1="' + x0 + '" y1="' + px(yD) + '" x2="' + x0 + '" y2="' + yG + '" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 6" fill="none"/>';
    o += '<text x="' + (x0 + 9) + '" y="' + (yG - 9) + '" class="t-ref">90°</text>';
    o += '<text x="' + (x0 - 12) + '" y="' + px(Math.min(yG - 8, (yD + yG) / 2 + 8)) + '" text-anchor="end" class="t-dim">' + grp(h) + ' м</text>';
    if (a >= 1) {
      /* The tilt itself: an arc from the horizon down to where the camera looks, with its value. */
      var R = clamp((yG - yD - 4) / Math.max(Math.sin(a * RAD), 0.001), 20, 110);
      var ax = px(x0 + R * Math.cos(a * RAD)), ay = px(yD + R * Math.sin(a * RAD));
      o += '<line x1="' + x0 + '" y1="' + px(yD) + '" x2="' + ax + '" y2="' + ay + '" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 6" fill="none"/>';
      o += '<path d="M' + px(x0 + R) + ' ' + px(yD) + 'A' + px(R) + ' ' + px(R) + ' 0 0 1 ' + ax + ' ' + ay + '" stroke="var(--ink)" stroke-width="2" fill="none"/>';
      o += '<text x="' + px(x0 + R + 8) + '" y="' + px(yD - 9) + '" class="t-ref t-ink">' + dec(a) + '°</text>';
    }
    o += ray(T, 'var(--muted)', 2);
    o += ray(B, 'var(--accent)', 4);
    o += '<g fill="var(--ink)"><rect x="' + (x0 - 14) + '" y="' + px(yD - 4) + '" width="28" height="8" rx="3"/>' +
      '<rect x="' + (x0 - 22) + '" y="' + px(yD - 10) + '" width="16" height="3" rx="1.5"/>' +
      '<rect x="' + (x0 + 6) + '" y="' + px(yD - 10) + '" width="16" height="3" rx="1.5"/></g>';
    if (r.bottom !== null && B.k === 'ground') {
      var xa = Math.min(x0, B.x), xb2 = Math.max(x0, B.x);
      o += '<line x1="' + px(xa) + '" y1="' + (yG + 22) + '" x2="' + px(xb2) + '" y2="' + (yG + 22) + '" stroke="var(--accent)" stroke-width="2.5" fill="none"/>';
      o += '<line x1="' + px(xa) + '" y1="' + (yG + 15) + '" x2="' + px(xa) + '" y2="' + (yG + 29) + '" stroke="var(--accent)" stroke-width="2.5" fill="none"/>';
      o += '<line x1="' + px(xb2) + '" y1="' + (yG + 15) + '" x2="' + px(xb2) + '" y2="' + (yG + 29) + '" stroke="var(--accent)" stroke-width="2.5" fill="none"/>';
      o += '<text x="' + px(clamp((xa + xb2) / 2, 80, W - 80)) + '" y="' + (yG + 56) + '" text-anchor="middle" class="t-acc">' + grp(r.bottom) + ' м</text>';
    } else if (r.bottom !== null && B.k === 'right') {
      o += '<text x="' + (xMax - 8) + '" y="' + (yG + 56) + '" text-anchor="end" class="t-acc">' + grp(r.bottom) + ' м →</text>';
    } else if (r.bottom !== null && B.k === 'left') {
      o += '<text x="14" y="' + (yG + 56) + '" text-anchor="start" class="t-acc">← ' + grp(r.bottom) + ' м</text>';
    }
    $('v-body').innerHTML = o;
    $('v-handle').setAttribute('transform', 'translate(' + px(B.x) + ' ' + px(B.y) + ')');
  }

  /* The camera screen: sky above the horizon, ground with lines of equal distance, the bottom edge carries the answer. */
  function drawScreen(h, a, v, r) {
    var W = 720, H = 405, cy = H / 2, th = Math.tan(v / 2 * RAD), o = '', i;
    function Y(n) { return cy - n * cy; }
    var Yh = a >= 89.5 ? -1e7 : Y(Math.tan(a * RAD) / th);
    var gTop = clamp(Yh, 0, H);
    o += '<rect width="' + W + '" height="' + H + '" fill="var(--accent-soft)"/>';
    if (gTop < H) {
      o += '<rect y="' + px(gTop) + '" width="' + W + '" height="' + px(H - gTop) + '" fill="var(--earth)"/>';
      var k = (gTop - Yh) / (H - Yh);
      for (i = -8; i <= 8; i++) {
        var xb = W / 2 + i * 130;
        o += '<line x1="' + px(W / 2 + (xb - W / 2) * k) + '" y1="' + px(gTop) + '" x2="' + px(xb) + '" y2="' + H +
          '" stroke="var(--ground)" stroke-opacity=".35" stroke-width="1"/>';
      }
      if (Yh > 0) o += '<line x1="0" y1="' + px(Yh) + '" x2="' + W + '" y2="' + px(Yh) + '" stroke="var(--ground)" stroke-width="1.5"/>';
      var lastY = H - 34, n = 0;
      for (i = 0; i < NICE.length && n < 6; i++) {
        var phi = a - Math.atan2(h, NICE[i]) / RAD;
        if (Math.abs(phi) >= 85) continue;
        var yd = Y(Math.tan(phi * RAD) / th);
        if (yd < gTop + 26) break;
        if (yd > lastY) continue;
        o += '<line x1="' + (yd > H - 70 ? 270 : 0) + '" y1="' + px(yd) + '" x2="' + W + '" y2="' + px(yd) + '" stroke="var(--ground)" stroke-width="1.5" stroke-dasharray="3 7"/>';
        o += '<text x="' + (W - 14) + '" y="' + px(yd - 7) + '" text-anchor="end" class="t-iso">' + grp(NICE[i]) + ' м</text>';
        lastY = yd - 38; n++;
      }
    }
    if (Yh > 30 && Yh < H - 70) o += '<text x="18" y="' + px(Yh - 9) + '" class="t-ref">горизонт</text>';
    if (r.top !== null && r.top < 1e5) o += '<text x="18" y="30" class="t-iso">' + grp(r.top) + ' м</text>';
    o += '<path d="M' + (W / 2 - 16) + ' ' + cy + 'H' + (W / 2 + 16) + 'M' + (W / 2) + ' ' + (cy - 16) + 'V' + (cy + 16) + '" stroke="var(--ink)" stroke-width="1.5" fill="none"/>';
    o += '<rect y="' + (H - 8) + '" width="' + W + '" height="8" fill="var(--accent)"/>';
    if (r.bottom !== null) o += '<text x="18" y="' + (H - 24) + '" class="t-big">' + grp(r.bottom) + ' м</text>';
    $('scr').innerHTML = o;
  }

  /* Lookup table for the chosen camera and zoom: tilt down the side, height across, distance to the bottom edge inside. */
  function drawTable(v) {
    var p = presetObj(), o = '', i, j;
    o += '<caption>' + DEVNAME[st.dev] + ' · ' + (p ? p.label : dec(st.zoom) + 'x') + '</caption><thead><tr><th></th>';
    for (j = 0; j < TH.length; j++) o += '<th scope="col">' + TH[j] + ' м</th>';
    o += '</tr></thead><tbody>';
    for (i = 0; i < TA.length; i++) {
      o += '<tr><th scope="row">' + TA[i] + '°</th>';
      for (j = 0; j < TH.length; j++) {
        var d = calc(TH[j], TA[i], v).bottom;
        o += '<td><button class="cell" type="button" data-h="' + TH[j] + '" data-a="' + TA[i] + '" aria-pressed="' +
          (st.h === TH[j] && st.a === TA[i]) + '">' + (d === null ? '—' : grp(d)) + '</button></td>';
      }
      o += '</tr>';
    }
    $('tbl').innerHTML = o + '</tbody>';
  }

  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }

  function render() {
    var v = currentV(), r = calc(st.h, st.a, v), notes = [];
    if (r.bottom === null) {
      $('out-d').textContent = '—';
      $('out-unit').hidden = true;
      $('out-pm').hidden = true;
      notes.push('Нижній край кадру вище горизонту. Опусти камеру.');
    } else {
      $('out-d').textContent = grp(r.bottom);
      $('out-unit').hidden = false;
      $('out-pm').hidden = false;
      $('out-pm').textContent = '± ' + grp(r.err) + ' м';
      if (Math.round(r.bottom) < 0) notes.push('Край кадру позаду борта.');
      if (r.bottom > 1500) notes.push('Понад 1500 м орієнтовно.');
    }
    $('out-msg').textContent = notes.join(' ');
    $('out-msg').hidden = !notes.length;
    if (st.view === 'screen') drawScreen(st.h, st.a, v, r);
    else if (st.view === 'table') drawTable(v);
    else drawSide(st.h, st.a, r);
    marks();
    save();
  }

  function marks() {
    var i, b;
    b = $('h-chips').children; for (i = 0; i < b.length; i++) b[i].setAttribute('aria-pressed', String(+b[i].dataset.h === st.h));
    b = $('a-chips').children; for (i = 0; i < b.length; i++) b[i].setAttribute('aria-pressed', String(+b[i].dataset.a === st.a));
    b = $('devs').children; for (i = 0; i < b.length; i++) b[i].setAttribute('aria-pressed', String(b[i].dataset.dev === st.dev));
    b = $('presets').children; for (i = 0; i < b.length; i++) b[i].setAttribute('aria-pressed', String(b[i].dataset.id === st.preset));
    b = $('views').children; for (i = 0; i < b.length; i++) b[i].setAttribute('aria-pressed', String(b[i].dataset.view === st.view));
    $('night').setAttribute('aria-pressed', String(!!st.night));
  }
  function fields() {
    $('h-num').value = String(st.h);
    $('h-range').value = String(clamp(st.h, 10, 1500));
    $('a-num').value = dec(st.a);
    $('a-range').value = String(st.a);
    $('z-num').value = dec(currentZ());
  }
  function buildPresets() {
    var html = '', list = DEV[st.dev].presets;
    for (var i = 0; i < list.length; i++) {
      html += '<button class="chip" type="button" data-id="' + list[i].id + '">' + list[i].label + '</button>';
    }
    $('presets').innerHTML = html;
  }
  function showView() {
    for (var i = 0; i < VIEWS.length; i++) $('pane-' + VIEWS[i]).hidden = VIEWS[i] !== st.view;
  }
  function applyNight() {
    if (st.night) document.documentElement.setAttribute('data-night', '1');
    else document.documentElement.removeAttribute('data-night');
  }

  function setH(n, keepField) { st.h = clamp(Math.round(n), 1, 20000); if (!keepField) $('h-num').value = String(st.h); $('h-range').value = String(clamp(st.h, 10, 1500)); render(); }
  function setA(n, keepField) { st.a = clamp(Math.round(n * 10) / 10, 0, 90); if (!keepField) $('a-num').value = dec(st.a); $('a-range').value = String(st.a); render(); }

  $('h-num').addEventListener('input', function () { var n = num(this.value); if (n !== null && n >= 1) setH(n, true); });
  $('h-num').addEventListener('change', function () { this.value = String(st.h); });
  $('h-range').addEventListener('input', function () { setH(+this.value); });
  $('h-minus').addEventListener('click', function () { setH(st.h - 10); });
  $('h-plus').addEventListener('click', function () { setH(st.h + 10); });
  $('h-chips').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setH(+b.dataset.h); });

  $('a-num').addEventListener('input', function () { var n = num(this.value); if (n !== null) setA(n, true); });
  $('a-num').addEventListener('change', function () { this.value = dec(st.a); });
  $('a-range').addEventListener('input', function () { setA(+this.value); });
  $('a-minus').addEventListener('click', function () { setA(st.a - 1); });
  $('a-plus').addEventListener('click', function () { setA(st.a + 1); });
  $('a-chips').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) setA(+b.dataset.a); });

  $('devs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    st.dev = b.dataset.dev; st.preset = DEV[st.dev].presets[0].id; st.zoom = DEV[st.dev].presets[0].z;
    buildPresets(); $('z-num').value = dec(st.zoom); render();
  });
  $('presets').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    st.preset = b.dataset.id; st.zoom = presetObj().z;
    $('z-num').value = dec(st.zoom); render();
  });
  $('z-num').addEventListener('input', function () {
    var n = num(this.value); if (n === null || n < 1) return;
    st.zoom = clamp(n, 1, 200); st.preset = null; render();
  });
  $('z-num').addEventListener('change', function () { this.value = dec(currentZ()); });

  $('views').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    st.view = b.dataset.view; showView(); render();
  });
  $('tbl').addEventListener('click', function (e) {
    var b = e.target.closest('.cell'); if (!b) return;
    st.h = +b.dataset.h; st.a = +b.dataset.a; fields(); render();
  });
  $('night').addEventListener('click', function () { st.night = !st.night; applyNight(); render(); });

  /* Pull the ground point with a finger: the beam follows it and the tilt changes. The scale is frozen while held so the point stays under the finger. */
  var handle = $('v-handle'), svg = $('view');
  function dragTo(e) {
    var m = svg.getScreenCTM(); if (!m) return;
    var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    var q = pt.matrixTransform(m.inverse()), dx = q.x - geo.x0, dy = q.y - geo.yD;
    if (Math.abs(dx) < 2 && Math.abs(dy) < 2) return;
    setA(Math.round((Math.atan2(dy, dx) / RAD - currentV() / 2) * 2) / 2);
  }
  function endDrag() { if (drag) { drag = null; render(); } }
  handle.addEventListener('pointerdown', function (e) {
    drag = { s: geo.s };
    try { handle.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  handle.addEventListener('pointermove', function (e) { if (drag) dragTo(e); });
  handle.addEventListener('pointerup', endDrag);
  handle.addEventListener('pointercancel', endDrag);
  handle.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });

  applyNight(); buildPresets(); fields(); showView(); render();
})();
</script>
<script>
/* Offline: the service worker keeps every file of the app in the cache. */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
/* Status-bar colour follows the night button. */
(function () {
  var root = document.documentElement;
  new MutationObserver(function () {
    var n = root.getAttribute('data-night') === '1', t = document.querySelectorAll('meta[name="theme-color"]');
    if (n) { for (var i = 0; i < t.length; i++) { if (!t[i].hasAttribute('data-orig')) t[i].setAttribute('data-orig', t[i].content); t[i].content = '#050000'; t[i].removeAttribute('media'); } }
    else { for (var j = 0; j < t.length; j++) { if (t[j].hasAttribute('data-orig')) t[j].content = t[j].getAttribute('data-orig'); } }
  }).observe(root, { attributes: true, attributeFilter: ['data-night'] });
})();
</script>
